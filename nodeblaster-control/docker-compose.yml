version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: server
      APP_PORT: 8080

  server:
    image: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    user: "1000:1000"
    init: true
    restart: on-failure
    command: node /app/server.js
    environment:
      PORT: 8080
      NODEBLASTER_DATA_DIR: /data
      NODEBLASTER_WWW_DIR: /app/www
    volumes:
      - ${APP_DATA_DIR}/server.js:/app/server.js:ro
      - ${APP_DATA_DIR}/www:/app/www:ro
      - ${APP_DATA_DIR}/data:/data

  bootstrap:
    image: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    user: "0:0"
    pid: host
    privileged: true
    restart: "no"
    command: node /bootstrap/bootstrap.js
    environment:
      NODEBLASTER_HOST_ROOT: /proc/1/root
      NODEBLASTER_BOOTSTRAP_DIR: /bootstrap
      NODEBLASTER_DATA_DIR: /data
      NODEBLASTER_BOOTSTRAP_STATUS: /data/bootstrap-status.json
    volumes:
      - ${APP_DATA_DIR}/bootstrap:/bootstrap:ro
      - ${APP_DATA_DIR}/data:/data
